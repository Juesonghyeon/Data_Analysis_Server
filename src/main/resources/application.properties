spring.application.name=DATA_ANALYSIS-BACKEND

# DataSource - MySQL (실제 값은 application-local.properties 에 설정)
spring.datasource.url=jdbc:mysql://localhost:3306/career_app?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Groq
groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1
groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

# Docker Compose 자동 실행 비활성화 (로컬 MySQL 직접 연결)
spring.docker.compose.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 로컬 설정 파일 (git 제외) 을 자동으로 불러옴
spring.config.import=optional:classpath:application-local.properties
